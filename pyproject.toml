[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taa-signals"
version = "0.1.0"
description = "A transparent Streamlit backtester for HAA strategies"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.38",
  "pandas>=2.1",
  "numpy>=1.26",
  "exchange-calendars==4.13",
  "yfinance>=0.2.43",
  "plotly>=5.24",
  "tasekit @ git+https://github.com/guyru/tasekit.git@425942e170875a58b219b9832733fef3a3d1f406",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
